<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasir Catat.in</title>
<meta name="description" content="Kasir browser yang mencatat penjualan dan HPP langsung ke jurnal Ilham ERP.">
<meta name="theme-color" content="#12305c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Catat.in">
<style>
:root{--n:#12305c;--b:#2f7de1;--bg:#f5f7fb;--l:#e1e7f0;--t:#1b2433;--m:#5d6b82;--r:#c0392b;--g:#1d8a52}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--t);background:var(--bg);overflow-wrap:anywhere}
button,input,select{font:inherit}h1{font-size:1.35rem;margin:.1em 0 .5em}h2{font-size:1.05rem;margin:0}
.top{background:var(--n);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 14px;position:sticky;top:0;z-index:6;min-height:54px}
.logo{font-weight:700;font-size:1.2rem}.logo b{color:#7db4ff}
.hb{background:none;border:1px solid #4a6fa5;color:#fff;border-radius:8px;width:44px;height:40px;font-size:1.3rem;cursor:pointer}
.top nav{display:none;position:absolute;top:100%;right:8px;width:min(240px,calc(100vw - 16px));flex-direction:column;background:var(--n);padding:6px;border-radius:0 0 12px 12px;box-shadow:0 8px 20px #0004}.top nav.open{display:flex}
.top a{color:#cfe0fb;text-decoration:none;padding:10px 12px;border-radius:8px;cursor:pointer}.top a.on{background:#25508f;color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:14px}.grid .card{margin:0;padding:14px}.stat small{color:var(--m)}.stat div{font-size:clamp(1.05rem,4.6vw,1.45rem);font-weight:700;color:var(--n)}.stat.w{grid-column:1/-1}
.pos{display:grid;gap:14px;grid-template-columns:1fr}
label{display:block;font-size:.9rem;color:var(--m);margin:10px 0 3px}input,select{width:100%;min-height:44px;padding:9px 12px;border:1px solid #b9c5d8;border-radius:10px;background:#fff}
input:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:600}.btn.s{background:#fff;color:var(--n);border:1px solid #b9c5d8}.btn:disabled{opacity:.45;cursor:not-allowed}.sm{padding:4px 12px;min-height:36px;font-size:.88rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.err{color:var(--r);font-size:.9rem;margin:6px 0;min-height:1px}.ok{color:var(--g)}.mut{color:var(--m);font-size:.9rem}
.pl{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));max-height:42vh;overflow:auto;margin-top:10px}.pi{text-align:left;background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px;cursor:pointer;min-height:76px}.pi:hover{border-color:var(--b)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--l);cursor:pointer}.li:last-child{border:0}
.ci{padding:10px 0;border-bottom:1px solid var(--l)}.ci1,.ci2{display:flex;justify-content:space-between;align-items:center;gap:8px}.ci2{margin:6px 0}.st{display:flex;gap:4px;align-items:center}.st .btn{width:40px;padding:0}.st input{width:56px;text-align:center;padding:8px 4px}
details summary{cursor:pointer;padding:4px 0;color:var(--n);font-weight:600}.flt{padding:10px 16px;margin:10px 0}
.tag{background:#fff3cd;color:#7a5b00;border-radius:6px;padding:2px 8px;font-size:.8rem;font-weight:600}.warn{background:#fff8e1;border:1px solid #f0d78a;border-radius:10px;padding:10px;font-size:.9rem;margin-bottom:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--l);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:4}.tot{font-size:1.4rem;font-weight:700;color:var(--n)}.bar .btn{min-width:120px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:8px 6px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}th{color:var(--m)}
.auth{max-width:420px;margin:5vh auto;padding:0 16px}.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.md{background:#fff;border-radius:14px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
input[readonly]{background:#eef2f8;color:var(--m)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw}.rcpt{font-family:ui-monospace,monospace;font-size:.85rem}.rcpt hr{border:0;border-top:1px dashed #888}
@media(min-width:800px){.hb{display:none}.top{justify-content:flex-start;gap:24px}.top nav{display:flex;position:static;flex-direction:row;width:auto;background:none;box-shadow:none;padding:0;flex:1}.top nav a:last-child{margin-left:auto}.pos{grid-template-columns:1.2fr 1fr}.grid{grid-template-columns:repeat(4,1fr)}.stat.w{grid-column:auto}}@media(min-width:1024px){main{max-width:1180px}}
.plogo{display:block;max-width:160px;max-height:96px;margin:6px 0 8px;padding:4px;border:1px solid var(--l);border-radius:8px;background:#fff}.rlogo{display:block;margin:0 auto 6px;max-width:120px;max-height:56px}
.pwa{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pwa>div:first-child{flex:1;min-width:180px}.pwa .row{flex-wrap:nowrap}
@media print{body *{visibility:hidden}.rcpt,.rcpt *{visibility:visible}.rcpt{position:absolute;left:0;top:0;width:100%}.ov{background:none}}
</style></head><body><div id="app"></div><div id="ov"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/sale-core.js"></script>
<script src="assets/app.js"></script>
<script src="assets/pos-erp.js"></script>
<script>
const K='catatin.v1',SCHEMA='1.2';
let db=null,cart=[],pay={m:'Tunai',paid:''},saving=false,q='',pq='',hf={q:'',a:'',b:''},ex={a:'',b:''},loading=false;
let erpUser=null,erpBiz=null,accounts=[],catalog=[],mapping={},bootError='',booting=true,catalogCachedAt='';
function legacyDb(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&Array.isArray(d.txs)&&d.biz)return d}catch(e){}return null}
function storeKey(){return 'catatin.v2.'+((erpUser&&erpUser.id)||'anon')+'.'+((erpBiz&&erpBiz.id)||'none')}
function loadDb(){try{const d=JSON.parse(localStorage.getItem(storeKey()));if(d&&Array.isArray(d.txs)&&Array.isArray(d.products)&&d.biz)return d}catch(e){}return {v:2,biz:{},products:[],txs:[],seq:{}}}
function save(){if(!db)return;db.erpUserId=(erpUser&&erpUser.id)||null;db.erpBusinessId=(erpBiz&&erpBiz.id)||null;localStorage.setItem(storeKey(),JSON.stringify(db))}
const $=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IDR=new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0,minimumFractionDigits:0}),rp=n=>IDR.format(n).replace(/\s/g,''),p2=n=>String(n).padStart(2,'0');
const num=s=>Number(String(s).replace(/\D/g,''))||0,fmt=n=>n===''||n==null?'':Number(n).toLocaleString('id-ID');
function mask(el){const pos=el.selectionStart,keep=el.value.slice(0,pos).replace(/\D/g,'').length,d=el.value.replace(/\D/g,'').slice(0,12).replace(/^0+(?=\d)/,'');el.value=d?Number(d).toLocaleString('id-ID'):'';let c=0,i=0;while(i<el.value.length&&c<keep){if(/\d/.test(el.value[i]))c++;i++}el.setSelectionRange(i,i)}
const dstr=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),tstr=d=>p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).slice(0,8).toUpperCase();
async function hash(s,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const demoNote='<div class="warn"><b>Mode Demo.</b> Akun dan data hanya tersimpan di browser perangkat ini. Ini bukan autentikasi produksi, dan data tidak dicadangkan secara online.</div>';
function go(h){location.hash=h}
window.onhashchange=render;
function render(){
  if(booting){$('app').innerHTML='<div class="auth"><div class="card"><h1>Memuat data ERP…</h1><p class="mut">Mengambil usaha, akun, produk, dan resep.</p></div></div>';return}
  if(bootError){$('app').innerHTML=`<div class="auth"><div class="card"><h1>Tidak bisa memuat</h1><div class="err">${esc(bootError)}</div><div class="row"><button class="btn" onclick="location.reload()">Coba lagi</button><button class="btn s" onclick="logout()">Keluar</button></div><p class="mut">Kalau masalah berlanjut, buka ERP untuk memeriksa akun dan koneksi.</p></div></div>`;return}
  if(!erpBiz||!db){$('app').innerHTML=noBusinessPage();return}
  const v=(location.hash||'#').slice(1)||'dash';
  const nav=[['dash','Beranda'],['pos','Kasir'],['products','Katalog'],['history','Riwayat'],['export','Ekspor CSV'],['setup','Pengaturan'],['profile','Profil']];
  const pg={dash,pos,products,history,export:exportPg,setup,profile}[v]||dash;
  $('app').innerHTML=`<header class="top"><span class="logo">catat<b>.in</b></span><button class="hb" aria-label="Menu" aria-expanded="false" onclick="tm(this)">☰</button><nav id="nv">${nav.map(([k,t])=>`<a class="${k===v?'on':''}" onclick="gn('${k}')">${t}</a>`).join('')}<a onclick="logout()">Keluar</a></nav></header><main><div id="netbar"></div>${pg()}</main>`;
  if(v==='pos')list();
  netbar();
}
function tm(b){const o=$('nv').classList.toggle('open');b.setAttribute('aria-expanded',o)}
function gn(k){if(location.hash==='#'+k)render();else go(k)}
/* AUTH (Supabase ERP) */
function loginPage(msg=''){$('app').innerHTML=`<div class="auth"><div class="logo" style="font-size:1.8rem;color:var(--n)">catat<b style="color:var(--b)">.in</b></div><h1>Masuk ke Kasir</h1><div class="warn">Kasir memakai akun Ilham ERP yang sama. Jika halaman tidak berpindah, buka <a href="login.html">halaman masuk</a>.</div><div class="err">${esc(msg)}</div></div>`}
function regPage(){loginPage('Pendaftaran dilakukan di halaman masuk Ilham ERP.')}
function logout(){if(window.ERPAuth)return ERPAuth.signOut();location.replace('login.html')}
function noBusinessPage(){return `<div class="auth"><div class="card"><h1>Belum ada usaha</h1><p>Akun ini belum punya usaha aktif di ERP. Buat atau pilih usaha dulu.</p><p><a class="btn" href="https://accountingilhamv1.github.io/Ilhamoke/business.html">Buka Data Usaha</a></p><p class="mut">Setelah itu kembali ke halaman Kasir.</p></div></div>`}
function setM(t){const e=$('m');if(e)e.textContent=t}
/* PWA, INSTALASI, DAN STATUS KONEKSI */
let installEvt=null,pwaInstalled=false;
function onlineNow(){return typeof navigator==='undefined'||navigator.onLine!==false}
function standalone(){try{return !!((window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true)}catch(e){return false}}
function offlineWarn(){return `<div class="warn" style="margin:0 0 14px"><b>Tidak ada koneksi internet.</b> Transaksi baru belum bisa disimpan sampai koneksi kembali. Data yang sudah tampil tetap bisa dilihat, tetapi jangan menutup aplikasi sebelum transaksi tercatat.</div>`}
function netbar(){const e=$('netbar');if(!e)return;e.innerHTML=onlineNow()?'':offlineWarn()}
function installDismissed(){try{return localStorage.getItem('catatin.pwa.dismiss')==='1'}catch(e){return false}}
function installCard(){if(standalone()||pwaInstalled||installDismissed())return '';
  return `<div class="card pwa"><div><b>Pasang aplikasi kasir</b><div class="mut">Buka kasir langsung dari layar utama, seperti aplikasi biasa. Data tetap tersimpan di Ilham ERP.</div></div><div class="row"><button class="btn" onclick="installApp()">Pasang</button><button class="btn s sm" onclick="dismissInstall()">Nanti</button></div></div>`}
function installApp(){if(installEvt){const e=installEvt;installEvt=null;e.prompt();const after=()=>{if(!standalone()&&!pwaInstalled)render()};if(e.userChoice&&e.userChoice.then)e.userChoice.then(after,after);else after();return}
  ov(`<h2>Pasang aplikasi kasir</h2><p>Browser ini belum menampilkan tombol pasang otomatis. Ikuti langkah berikut:</p><ol style="margin:6px 0 0 18px;padding:0"><li><b>Android Chrome:</b> menu ⋮ → “Pasang aplikasi” atau “Tambahkan ke Layar utama”.</li><li><b>iPhone/iPad Safari:</b> tombol Bagikan → “Tambahkan ke Layar Utama”.</li><li><b>Desktop Chrome/Edge:</b> ikon pasang di kanan address bar.</li></ol><p class="mut">Aplikasi harus dibuka lewat alamat https:// (atau localhost). Setelah terpasang, kasir bisa dibuka tanpa address bar. Login dan penyimpanan transaksi tetap memerlukan internet.</p><button class="btn" style="margin-top:12px" onclick="cl()">Mengerti</button>`)}
function dismissInstall(){try{localStorage.setItem('catatin.pwa.dismiss','1')}catch(e){}render()}
function regSW(){if(typeof navigator==='undefined'||!navigator.serviceWorker||!/^https?:$/.test(location.protocol))return;
  navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(e){console.warn('Service worker gagal dipasang:',e)})}
if(window.addEventListener){
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;if(!standalone()&&!installDismissed())render()});
  window.addEventListener('appinstalled',function(){installEvt=null;pwaInstalled=true;toast('Aplikasi kasir terpasang.');render()});
  window.addEventListener('online',function(){netbar();toast('Koneksi kembali.')});
  window.addEventListener('offline',function(){netbar();toast('Tidak ada koneksi internet.')});
}
/* SALINAN KATALOG UNTUK DIBUKA SAAT OFFLINE */
const CATCACHE='catatin.catalog.';
function saveCatalogCache(id,items){try{localStorage.setItem(CATCACHE+id,JSON.stringify({at:new Date().toISOString(),items}))}catch(e){}}
function readCatalogCache(id){try{const d=JSON.parse(localStorage.getItem(CATCACHE+id));if(d&&Array.isArray(d.items)&&d.items.length)return d}catch(e){}return null}
/* DASHBOARD */
function legacyBanner(){const old=legacyDb();if(!old||!Array.isArray(old.txs)||!old.txs.length)return '';if(old.importedTo&&old.importedTo[storeKey()])return '';
  return `<div class="warn"><b>Data lokal lama ditemukan.</b> ${old.txs.length} transaksi dari aplikasi Kasir sebelumnya belum ada di usaha ini. <button class="btn s sm" onclick="importLegacy()">Salin ke usaha ini</button> <button class="btn s sm" onclick="skipLegacy()">Abaikan</button><div class="mut">Data lama tidak dihapus. Transaksi yang disalin tetap berstatus lokal sampai dicatat ke ERP.</div></div>`}
function importLegacy(){const old=legacyDb();if(!old||!Array.isArray(old.txs))return;if(!confirm('Salin '+old.txs.length+' transaksi lokal lama ke usaha '+erpBiz.name+'? Data lama tetap disimpan.'))return;
  const seen=new Set(db.txs.map(t=>String(t&&t.id)));let n=0;(old.txs||[]).forEach(t=>{if(t&&t.id&&!seen.has(String(t.id))){db.txs.push(Object.assign({},t,{legacyLocal:true}));seen.add(String(t.id));n++}});
  if(old.biz&&old.biz.logo&&!db.biz.logo)db.biz.logo=old.biz.logo;
  Object.keys(old.seq||{}).forEach(k=>{db.seq[k]=Math.max(Number(db.seq[k])||0,Number(old.seq[k])||0)});
  old.importedTo=old.importedTo||{};old.importedTo[storeKey()]=new Date().toISOString();try{localStorage.setItem(K,JSON.stringify(old))}catch(e){}
  save();render();toast(n+' transaksi lama disalin.')}
function skipLegacy(){const old=legacyDb();if(!old)return;old.importedTo=old.importedTo||{};old.importedTo[storeKey()]=new Date().toISOString();try{localStorage.setItem(K,JSON.stringify(old))}catch(e){}render()}
/* DASHBOARD */
function dash(){const t=dstr(new Date()),tx=db.txs.filter(x=>x.date===t&&!x.void),sum=tx.reduce((a,x)=>a+x.total,0),act=catalog.filter(p=>p.active).length;
  return `<div class="row sp"><h1>Beranda</h1><button class="btn" onclick="go('pos')">Mulai transaksi</button></div><p class="mut" style="margin-top:-6px">${esc(db.biz.name)}${erpUser&&erpUser.email?' · '+esc(erpUser.email):''}</p>${installCard()}${legacyBanner()}${catalogCachedAt?`<div class="warn">Katalog sedang memakai salinan terakhir (${esc(String(catalogCachedAt).slice(0,10))}) karena server belum bisa dihubungi. Harga dan HPP bisa berubah di ERP.</div>`:''}
<div class="grid"><div class="card stat w"><small>Omzet hari ini (bukan laba)</small><div>${rp(sum)}</div></div><div class="card stat"><small>Transaksi lokal hari ini</small><div>${tx.length}</div></div><div class="card stat"><small>Rata-rata</small><div>${rp(tx.length?Math.round(sum/tx.length):0)}</div></div><div class="card stat"><small>Produk aktif di ERP</small><div>${act}</div></div></div>
<div class="card"><div class="row sp"><h2>Transaksi terbaru</h2><a href="#history">Lihat semua</a></div>${txTable(db.txs.slice(-5).reverse())}</div>
<div class="mut">Penjualan dicatat sebagai jurnal di ERP. Stok bahan tidak diubah otomatis oleh kasir.</div>`}
function txTable(a,m){if(!a.length)return '<p class="mut">Belum ada transaksi. Mulai dari halaman Kasir.</p>';
  return a.map(x=>`<div class="li" onclick="detail('${x.id}')"><div><b>${esc(x.id)}</b> ${x.void?'<span class="tag">Dibatalkan</span>':''}${x.erpPostedAt?'<span class="tag" style="background:#e6f0ff;color:#12305c">ERP</span>':''}${x.legacyLocal&&!x.erpPostedAt?' <span class="tag">Lokal</span>':''}${x.exp?' <span class="tag">Diekspor</span>':''}<div class="mut">${x.date} ${x.time} · ${x.items.reduce((s,i)=>s+i.qty,0)} item · ${esc(x.method)}</div></div><div class="row" style="flex-wrap:nowrap"><b ${x.void?'style="text-decoration:line-through;color:var(--m)"':''}>${rp(x.total)}</b>${m?`<button class="btn s sm" aria-label="Tindakan transaksi" onclick="event.stopPropagation();txmenu('${x.id}')">⋯</button>`:''}</div></div>`).join('')}
/* KATALOG (dari ERP) */
function products(){const f=pq.toLowerCase(),a=catalog.filter(p=>(p.name+p.code).toLowerCase().includes(f));
  return `<div class="row sp"><h1>Katalog</h1><a class="btn s" href="https://accountingilhamv1.github.io/Ilhamoke/products.html">Kelola di ERP</a></div>
<p class="mut">Produk, bahan, resep, dan HPP diatur di ERP. Kasir hanya membaca katalog dan tidak mengubah stok.</p>
<input id="ps" type="search" placeholder="Cari nama atau kode produk" value="${esc(pq)}" oninput="pq=this.value;render();const e=$('ps');e.focus();e.setSelectionRange(pq.length,pq.length)">
<div class="card" style="margin-top:12px">${a.length?a.map(p=>`<div class="li" style="cursor:default"><div><b>${esc(p.name)}</b><div class="mut">${esc(p.code)}</div><div>${rp(p.price)} · ${p.cost==null?'<span class="mut">modal belum diisi</span>':'modal '+rp(p.cost)} · <span class="ok">Aktif</span></div></div></div>`).join(''):'<p class="mut">Belum ada produk aktif di ERP. Tambahkan produk dan resep di halaman Bahan & Produk ERP.</p>'}</div>`}
/* KODE PRODUK OTOMATIS */
function abbr(name){const w=String(name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9\s]/g,' ').split(/\s+/).map(x=>x.replace(/[^A-Z]/g,'')).filter(Boolean);
  if(!w.length)return 'PRD';return w.length===1?w[0].slice(0,3):w.slice(0,4).map(x=>x[0]).join('')}
function usedCodes(){const u=new Set();db.products.forEach(p=>u.add(String(p.code).toUpperCase()));db.txs.forEach(x=>x.items.forEach(i=>u.add(String(i.code||'').toUpperCase())));return u}
function nextNo(pre){let m=(db.codeSeq&&db.codeSeq[pre])||0;const re=new RegExp('^'+pre+'-(\\d+)$');usedCodes().forEach(c=>{const r=re.exec(c);if(r)m=Math.max(m,+r[1])});return m+1}
function peekCode(name){const pre=abbr(name),u=usedCodes();let n=nextNo(pre),c;do{c=pre+'-'+String(n++).padStart(3,'0')}while(u.has(c));return c}
function mkCode(name){const c=peekCode(name),i=c.lastIndexOf('-');db.codeSeq=db.codeSeq||{};db.codeSeq[c.slice(0,i)]=+c.slice(i+1);return c}
function demoProd(){[['Air mineral 600 ml','Minuman',4000],['Kopi susu, gelas','Minuman',15000],['Roti cokelat','Makanan',8000],['Buku tulis','Alat tulis',6500],['Kaus polos','Pakaian',55000]].forEach(([name,cat,price])=>db.products.push({id:'PRD-'+uid(),code:mkCode(name),name,cat,price,active:true,demo:true}));save();render()}

function setd(i,v){v=Math.min(Math.max(0,Math.floor(Number(v)||0)),cart[i].qty*cart[i].price);cart[i].disc=v;drawCart()}
function drawCart(){const t=total();

function payModal(){if(!cart.length)return;const t=total();const cogs=SaleCore.cogsFromItems(cart).total;const offline=!onlineNow();const problems=erpBiz?PosERP.mappingProblems(mapping,accounts,pay.m,cogs,erpBiz.id):['Usaha ERP belum siap.'];

${offline?'<div class="warn"><b>Tidak ada koneksi internet.</b> Transaksi belum bisa disimpan ke ERP. Sambungkan internet lalu buka pembayaran lagi.</div>':''}
${problems.length?`<div class="warn"><b>Pengaturan akun belum lengkap.</b> ${esc(problems.join(' '))} <a href="#setup" onclick="cl();go('setup')">Buka Pengaturan</a></div>`:''}
<div class="err" id="m"></div><div class="row"><button class="btn" id="sv" onclick="commit()" ${problems.length||offline?'disabled':''}>Simpan transaksi</button><button class="btn s" onclick="cl()">Kembali</button></div>`);chg()}
function chg(){const e=$('chg');if(!e)return;const t=total(),p=Number(pay.paid);e.innerHTML=pay.paid===''?'':p>=t?`Kembalian: <b>${rp(p-t)}</b>`:`<span class="err">Uang kurang ${rp(t-p)}</span>`}
async function commit(){if(saving)return;if(!onlineNow())return setM('Tidak ada koneksi internet. Transaksi belum disimpan. Sambungkan internet lalu tekan Simpan lagi.');const t=total(),pd=Number(pay.paid);
  if(!cart.length||cart.some(i=>!Number.isInteger(i.qty)||i.qty<1))return setM('Periksa kuantitas item.');if(t<=0)return setM('Total harus lebih dari 0.');
  if(pay.m==='Tunai'&&(pay.paid===''||!(pd>=t)))return setM('Uang diterima kurang dari total.');
  if(!erpBiz)return setM('Usaha ERP belum siap.');
  const cogsInfo=SaleCore.cogsFromItems(cart),problems=PosERP.mappingProblems(mapping,accounts,pay.m,cogsInfo.total,erpBiz.id);
  if(problems.length)return setM('Pengaturan akun belum lengkap: '+problems.join(' '));
  saving=true;const b=$('sv');if(b)b.disabled=true;
  const n=new Date(),d=dstr(n),key=d.replace(/-/g,''),seq=((db.seq[key]||0)+1);
  const id='TRX-'+key+'-'+String(seq).padStart(4,'0'),p=pay.m==='Tunai'?pd:t;
  const sale={id,date:d,time:tstr(n),method:pay.m,items:cart.map(i=>({pid:i.pid,code:i.code,name:i.name,qty:i.qty,price:i.price,disc:i.disc,line:i.qty*i.price-i.disc,cost:i.cost==null?null:i.cost})),total:t,paid:p,change:p-t,cogs:cogsInfo.total};
  const costWarning=cogsInfo.missing?`${cogsInfo.missing} item belum punya harga modal; HPP hanya dihitung dari item yang punya modal.`:'';
  try{
    const res=await PosERP.postSale(erpBiz.id,sale,mapping);
    if(!res.ok){setM((res.errors||['Gagal menyimpan ke ERP.']).join(' '));return}
    db.seq[key]=seq;
    const tx=Object.assign({},sale,{erpPostedAt:new Date().toISOString(),erpBusinessId:erpBiz.id,erpCogs:res.cogs,erpDuplicate:!!res.duplicate,erpWarning:[costWarning].concat(res.warnings||[]).filter(Boolean).join(' ')});
    let localSaved=true;
    try{db.txs.push(tx);save()}catch(e){db.txs.pop();localSaved=false}
    cart=[];pay={m:pay.m,paid:''};cl();render();
    receipt(tx,localSaved?(res.duplicate?'Transaksi ini sudah tercatat di ERP.':'Transaksi tersimpan dan tercatat di ERP.'):'Tercatat di ERP, tetapi riwayat lokal gagal disimpan.');
  }
  catch(e){setM(ERP.friendlyError?ERP.friendlyError(e):String((e&&e.message)||e))}
  finally{saving=false;const btn=$('sv');if(btn)btn.disabled=false}}
function receipt(x,msg){ov(`${msg?`<p class="ok">${msg}</p>`:''}${x.erpPostedAt?`<p class="ok">Tercatat di ERP${x.erpDuplicate?' (sudah ada)':''}.</p>`:''}${x.erpWarning?`<div class="warn">${esc(x.erpWarning)}</div>`:''}${x.void?'<p class="err"><b>TRANSAKSI DIBATALKAN</b></p>':''}<div class="rcpt">${okLogo(db.biz.logo)?`<img class="rlogo" src="${db.biz.logo}" alt="">`:''}<b>${esc(db.biz.name)}</b><br>${esc(db.biz.addr)}<hr>${x.id}<br>${x.date} ${x.time} · ${x.method}<hr>${x.items.map(i=>`${esc(i.name)} (${esc(i.code||'')})<br>&nbsp;${i.qty} x ${rp(i.price)}${i.disc?` − ${rp(i.disc)}`:''} = ${rp(i.line)}`).join('<br>')}<hr>TOTAL ${rp(x.total)}<br>Bayar ${rp(x.paid)}<br>Kembali ${rp(x.change)}<hr>Terima kasih</div><div class="row" style="margin-top:12px"><button class="btn" onclick="print()">Cetak struk</button><button class="btn s" onclick="cl()">Tutup</button></div>`)}

function unpostedLocal(){return db.txs.filter(x=>x&&!x.void&&!erpLocked(x))}
function txCogs(x){try{return SaleCore.cogsFromItems(x.items).total}catch(e){return 0}}
function localPostBanner(){const list=unpostedLocal();if(!list.length)return '';
  return `<div class="warn"><b>${list.length} transaksi lokal belum tercatat di ERP.</b> Transaksi ini baru tersimpan di browser ini dan belum masuk jurnal. <div class="row" style="margin-top:6px"><button class="btn sm" onclick="postLocal()">Catat ke ERP</button></div><div class="mut">Stok tidak diubah. Setelah tercatat, transaksi terkunci dari pembatalan/penghapusan di POS.</div></div>`}
function postLocal(id){const list=(id?db.txs.filter(x=>x.id===id):unpostedLocal()).filter(x=>x&&!x.void&&!erpLocked(x));
  if(!list.length)return toast('Tidak ada transaksi lokal yang perlu dicatat.');
  if(!onlineNow())return toast('Tidak ada koneksi internet. Transaksi belum dicatat ke ERP.');
  const total=list.reduce((s,x)=>s+x.total,0);
  ov(`<h2>Catat ke ERP</h2><p>${list.length} transaksi lokal (${rp(total)}) akan dicatat sebagai jurnal penjualan${list.some(x=>txCogs(x)>0)?' dan HPP':''} di <b>${esc(erpBiz.name)}</b>.</p><div class="warn">Jurnal yang sudah tercatat tidak bisa dibatalkan dari POS. Stok bahan tetap tidak diubah. Koreksi dilakukan lewat jurnal di ERP.</div><div id="pm" class="mut"></div><div class="err" id="m"></div><div class="row"><button class="btn" id="pok" onclick="postLocalDo(${JSON.stringify(id||null)})">Catat sekarang</button><button class="btn s" onclick="cl()">Batal</button></div>`)}
async function postLocalDo(id){if(saving)return;const list=(id?db.txs.filter(x=>x.id===id):unpostedLocal()).filter(x=>x&&!x.void&&!erpLocked(x));
  if(!list.length)return cl();const btn=$('pok'),msg=$('pm'),err=$('m');
  if(!onlineNow()){if(err)err.textContent='Tidak ada koneksi internet. Transaksi belum dicatat ke ERP.';return}
  if(btn)btn.disabled=true;saving=true;let done=0;const problems=[];
  for(let k=0;k<list.length;k++){const x=list[k];if(msg)msg.textContent='Mencatat '+(k+1)+' dari '+list.length+'…';
    try{const cogs=txCogs(x);
      const mapProblems=PosERP.mappingProblems(mapping,accounts,x.method,cogs,erpBiz.id);
      if(mapProblems.length){problems.push(x.id+': '+mapProblems.join(' '));continue}
      const sale={id:x.id,date:x.date,time:x.time,method:x.method,items:x.items,total:x.total,paid:x.paid,change:x.change,cogs:cogs};
      const res=await PosERP.postSale(erpBiz.id,sale,mapping);
      if(!res.ok){problems.push(x.id+': '+(res.errors||['Gagal menyimpan ke ERP.']).join(' '));continue}
      Object.assign(x,{erpPostedAt:new Date().toISOString(),erpBusinessId:erpBiz.id,erpCogs:res.cogs,erpDuplicate:!!res.duplicate,erpWarning:(res.warnings||[]).join(' '),cogs:cogs});
      try{save()}catch(e){}
      done++;
    }catch(e){problems.push(x.id+': '+(ERP.friendlyError?ERP.friendlyError(e):String((e&&e.message)||e)))}
  }
  saving=false;cl();render();
  if(!problems.length)return toast(done+' transaksi dicatat ke ERP.');
  ov(`<h2>Sebagian belum tercatat</h2><p><b>${done}</b> transaksi berhasil dicatat, <b>${problems.length}</b> belum.</p><div class="err">${esc(problems.slice(0,4).join(' '))}${problems.length>4?' …':''}</div><p class="mut">Periksa koneksi dan Pengaturan akun, lalu coba lagi dari Riwayat. Transaksi yang sudah berhasil tidak akan ditulis dua kali.</p><button class="btn" onclick="cl()">Tutup</button>`)}

function buildCsv(txs){const L=[HEAD.join(',')];txs.forEach(x=>x.items.forEach(i=>L.push([SCHEMA,db.biz.id,x.id,x.date,x.time,x.method,i.pid,i.name,i.qty,i.price,i.disc,i.line,x.total,x.paid,x.change,i.code||'',i.cost==null?'':i.cost,i.cost==null?'':i.qty*i.cost].map(cell).join(','))));return '\ufeff'+L.join('\r\n')+'\r\n'}
function exportPg(){return `<h1>Ekspor CSV</h1><div class="card"><div class="row"><div style="flex:1"><label>Tanggal awal</label><input type="date" id="xa" value="${ex.a}" onchange="ex.a=this.value;xp()"></div><div style="flex:1"><label>Tanggal akhir</label><input type="date" id="xb" value="${ex.b}" onchange="ex.b=this.value;xp()"></div></div><div id="xp"></div>

function csvProblems(txs){const out=[],seen=new Set(),isInt=v=>Number.isInteger(v),methods=['Tunai','Transfer','QRIS'],dateOk=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));if(!m)return false;const y=+m[1],mo=+m[2],d=+m[3],dt=new Date(Date.UTC(y,mo-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===mo-1&&dt.getUTCDate()===d},timeOk=s=>{const m=/^(\d{2}):(\d{2}):(\d{2})$/.exec(String(s||''));return !!m&&+m[1]<24&&+m[2]<60&&+m[3]<60};if(!db||!db.biz||!(ERP.isUuid(db.biz.id)||/^BIZ-[A-Z0-9]{8}$/.test(String(db.biz.id||''))))out.push('business_id tidak sesuai format usaha ERP (UUID) atau BIZ-XXXXXXXX.');txs.forEach(x=>{if(!x||typeof x!=='object'){out.push('(data transaksi rusak)');return}const id=String(x.id||''),at=id||'(tanpa ID)';if(!/^TRX-\d{8}-\d{4}$/.test(id))out.push(at+': ID transaksi tidak sesuai format TRX-YYYYMMDD-NNNN.');if(seen.has(id))out.push(at+': ID transaksi duplikat dalam file.');seen.add(id);if(!dateOk(x.date))out.push(at+': transaction_date tidak valid.');if(!timeOk(x.time))out.push(at+': transaction_time tidak valid.');if(methods.indexOf(x.method)===-1)out.push(at+': payment_method harus Tunai, Transfer, atau QRIS.');if(!Array.isArray(x.items)||!x.items.length){out.push(at+': tidak punya item.');return}let sum=0;x.items.forEach((i,k)=>{const line=at+' item #'+(k+1);if(!i||typeof i!=='object'){out.push(line+': data item rusak.');return}if(!i.pid)out.push(line+': product_id kosong.');if(!i.name)out.push(line+': product_name kosong.');const qty=i.qty,price=i.price,disc=i.disc;if(!isInt(qty)||qty<1)out.push(line+': quantity wajib bilangan bulat minimal 1.');if(!isInt(price)||price<0)out.push(line+': unit_price wajib bilangan bulat minimal 0.');if(!isInt(disc)||disc<0)out.push(line+': discount_amount wajib bilangan bulat minimal 0.');if(isInt(qty)&&isInt(price)&&isInt(disc)){const lt=qty*price-disc;if(lt<0)out.push(line+': discount_amount melebihi nilai baris.');if(i.line!==lt)out.push(line+': line_total tidak sama dengan quantity × unit_price − discount_amount.');sum+=lt}if(i.cost!=null&&(!isInt(i.cost)||i.cost<0))out.push(line+': unit_cost harus kosong atau bilangan bulat minimal 0.')});const totalOk=isInt(x.total)&&x.total>0;if(!totalOk)out.push(at+': transaction_total wajib bilangan bulat lebih dari 0.');else if(sum!==x.total)out.push(at+': jumlah line_total ('+sum+') tidak sama dengan transaction_total ('+x.total+').');const paidOk=isInt(x.paid);if(!paidOk)out.push(at+': amount_paid wajib bilangan bulat.');if(!isInt(x.change))out.push(at+': change_amount wajib bilangan bulat.');if(totalOk&&paidOk){if(x.method==='Tunai'){if(x.paid<x.total)out.push(at+': amount_paid kurang dari transaction_total.');if(isInt(x.change)&&x.change!==x.paid-x.total)out.push(at+': change_amount tidak sama dengan amount_paid − transaction_total.')}else{if(x.paid!==x.total)out.push(at+': amount_paid non-tunai harus sama dengan transaction_total.');if(isInt(x.change)&&x.change!==0)out.push(at+': change_amount non-tunai harus 0.')}}});return out}
function problemList(ps){const shown=ps.slice(0,8);return `<ul style="margin:6px 0 0 18px;padding:0">${shown.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`+(ps.length>shown.length?`<p class="mut">Dan ${ps.length-shown.length} masalah lain.</p>`:'')}
function xp(){const e=$('xp');if(!e)return;if(ex.a&&ex.b&&ex.a>ex.b){e.innerHTML='<p class="err">Tanggal awal tidak boleh setelah tanggal akhir.</p>';return}
  const noPeriod=!ex.a&&!ex.b,r=rows(ex.a,ex.b),problems=csvProblems(r.t),nc=r.t.reduce((s,x)=>s+x.items.filter(i=>i.cost==null).length,0);e.innerHTML=`<h2 style="margin-top:12px">Pratinjau</h2><p>Periode: ${ex.a||'awal'} s/d ${ex.b||'sekarang'}${noPeriod?' (semua transaksi)':''}<br>Transaksi: <b>${r.t.length}</b> · Baris item: <b>${r.n}</b><br>Total penjualan (transaksi unik): <b>${rp(r.sum)}</b>${nc?`<br><span class="mut">${nc} baris item belum punya harga modal (HPP tidak dicatat untuk baris itu).</span>`:''}</p>${noPeriod?'<p class="mut">Tombol "Export Berdasarkan Periode" memerlukan minimal satu tanggal. Untuk mengekspor semua transaksi, gunakan "Export Semua Transaksi".</p>':''}${r.t.length?(problems.length?`<div class="err"><b>${problems.length} masalah pada data ekspor:</b>${problemList(problems)}</div>`:'<p class="ok">Data siap diekspor.</p>'):''}`+(r.n?`<div class="sc"><table><tr>${HEAD.slice(2,13).map(h=>`<th>${h}</th>`).join('')}</tr>${previewRows(r.t).map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div><p class="mut">Pratinjau 3 baris item pertama.</p>`:'')}
function dl(all){const a=all?'':ex.a,b=all?'':ex.b;if(!all&&!a&&!b)return ov('<h2>Periode belum dipilih</h2><p>Isi tanggal awal dan/atau tanggal akhir, atau gunakan tombol "Export Semua Transaksi". Tidak ada file yang dibuat.</p><button class="btn" onclick="cl()">Tutup</button>');if(a&&b&&a>b)return ov('<h2>Periode tidak valid</h2><p>Tanggal awal tidak boleh setelah tanggal akhir. Tidak ada file yang dibuat.</p><button class="btn" onclick="cl()">Tutup</button>');const r=rows(a,b);if(!r.t.length)return ov('<h2>Tidak ada transaksi</h2><p>Tidak ada transaksi pada periode ini, jadi file tidak dibuat.</p><button class="btn" onclick="cl()">Tutup</button>');
  const problems=csvProblems(r.t);if(problems.length)return ov(`<h2>Ekspor dibatalkan</h2><p class="err">Ada ${problems.length} masalah pada data yang akan diekspor. File tidak dibuat dan penanda ekspor tidak diubah.</p>${problemList(problems)}<button class="btn" onclick="cl()">Tutup</button>`);
  const n=new Date(),name=`catatin_transaksi_${db.biz.id}_${dstr(n).replace(/-/g,'')}_${tstr(n).replace(/:/g,'')}.csv`,u=URL.createObjectURL(new Blob([buildCsv(r.t)],{type:'text/csv;charset=utf-8'})),l=document.createElement('a');l.href=u;l.download=name;l.click();const iso=new Date().toISOString();r.t.forEach(x=>x.exp=iso);try{save()}catch(e){}setTimeout(()=>URL.revokeObjectURL(u),2000);
  ov(`<h2>File CSV berhasil dibuat</h2><p>${name}<br>${r.t.length} transaksi, ${r.n} baris.</p><button class="btn" onclick="cl()">Tutup</button>`)}
/* PENGATURAN AKUN */
function accountOptions(selected){return `<option value="">-- Pilih Akun --</option>`+accounts.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true})).map(a=>`<option value="${a.id}" ${ERP.idEqual(a.id,selected)?'selected':''}>${esc(a.code)} - ${esc(a.name)}</option>`).join('')}
function mappingFields(){const keys=PosERP.METHODS.map(m=>[m,'Metode '+m+' → akun Debit']).concat([['__revenue','Akun Pendapatan (Kredit)'],['__cogs','Akun HPP (Debit)'],['__inventory','Akun Persediaan (Kredit)']]);
  return keys.map(([k,label])=>`<div><label for="map-${k}">${label}</label><select id="map-${k}">${accountOptions(mapping[k])}</select></div>`).join('')}
function setup(){if(!erpBiz)return noBusinessPage();const businesses=ERP.getBusinesses().filter(b=>ERP.isUuid(b.id)),hasCost=catalog.some(p=>p.cost!=null),problems=PosERP.mappingSummary(mapping,accounts,PosERP.METHODS,hasCost);
  return `<h1>Pengaturan akun</h1><div class="card"><label>Usaha aktif</label>${businesses.length>1?`<select onchange="switchBusiness(this.value)">${businesses.map(b=>`<option value="${b.id}" ${ERP.idEqual(b.id,erpBiz.id)?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`:`<p><b>${esc(erpBiz.name)}</b></p>`}<p class="mut">Akun COA diambil dari ERP. Pemetaan ini sama dengan yang dipakai saat impor CSV di ERP.</p></div>
<div class="card"><h2>Pemetaan akun kasir</h2><div class="grid" style="grid-template-columns:1fr">${mappingFields()}</div><div class="${problems.length?'err':'ok'}" style="margin-top:10px">${problems.length?esc(problems.join(' ')):'Pemetaan lengkap.'}</div><button class="btn" style="margin-top:10px" onclick="saveSetup()">Simpan pemetaan</button><p class="mut">HPP hanya dicatat bila akun HPP dan persediaan dipilih. Tanpa keduanya, penjualan tetap dicatat tetapi HPP dilewati.</p></div>
<div class="card"><h2>Aplikasi kasir</h2><p class="mut">${standalone()?'Kasir sudah dibuka sebagai aplikasi terpasang.':'Pasang kasir ke layar utama agar bisa dibuka seperti aplikasi biasa. Login dan penyimpanan transaksi tetap memerlukan internet.'}</p><button class="btn s" onclick="installApp()">${standalone()?'Info pemasangan':'Cara pasang'}</button></div>
<div class="card"><h2>Catatan</h2><p class="mut">Kasir menulis jurnal penjualan dan HPP ke ERP. Stok bahan tidak diubah otomatis. Pembatalan transaksi yang sudah tercatat dilakukan lewat jurnal koreksi di ERP.</p></div>`}
function saveSetup(){const map={};PosERP.METHODS.concat(['__revenue','__cogs','__inventory']).forEach(k=>{const e=$('map-'+k);if(e)map[k]=e.value});PosERP.saveMapping(erpBiz.id,map);mapping=map;toast('Pemetaan disimpan.');render()}
async function switchBusiness(id){if(!id||id===erpBiz.id)return;if(cart.length&&!confirm('Ganti usaha akan mengosongkan keranjang. Lanjutkan?')){render();return}cart=[];booting=true;bootError='';render();try{await loadBusiness(id)}catch(e){bootError=ERP.friendlyError?ERP.friendlyError(e):String((e&&e.message)||e);booting=false;render()}}
/* PROFIL */
function profile(){const b=db.biz;return `<h1>Profil usaha</h1><div class="card"><p class="mut">Akun ERP: <b>${esc(erpUser&&erpUser.email||'-')}</b></p><p class="mut">ID usaha: <b>${esc(b.id||'-')}</b></p><label>Logo usaha (opsional, hanya untuk struk)</label><div id="lbox">${lview()}</div><input type="file" id="bl" accept="image/*" onchange="lupload(this)"><div class="mut">Tampil di struk. Gambar dikecilkan otomatis.</div><h2 style="margin-top:14px">${esc(b.name)}</h2><p class="mut">${esc(b.addr||'Alamat belum diisi di ERP.')}</p><div class="row"><a class="btn s" href="https://accountingilhamv1.github.io/Ilhamoke/business.html">Ubah data usaha di ERP</a><a class="btn s" href="https://accountingilhamv1.github.io/Ilhamoke/accounts.html">Buka COA</a></div></div><div class="warn">Nama, alamat, produk, bahan, dan akun diatur di ERP. Kasir tidak mengubah stok.</div>`}
function okLogo(l){return typeof l==='string'&&/^data:image\/(png|jpeg|webp|gif);base64,/.test(l)}
function lview(){const l=db.biz.logo;return okLogo(l)?`<img class="plogo" src="${l}" alt="Logo usaha"><button class="btn s sm" type="button" onclick="ldel()">Hapus logo</button>`:'<div class="mut">Belum ada logo.</div>'}
function lupload(el){const f=el.files&&el.files[0];if(!f)return;
  if(!/^image\/(png|jpe?g|webp|gif)$/i.test(f.type)){el.value='';return toast('File harus berupa gambar (PNG, JPG, atau WebP).')}
  if(f.size>8*1024*1024){el.value='';return toast('Ukuran gambar maksimal 8 MB.')}
  const rd=new FileReader();rd.onerror=()=>toast('Gagal membaca gambar.');
  rd.onload=()=>{const im=new Image();im.onerror=()=>toast('Gambar tidak bisa dibuka.');
    im.onload=()=>{const M=256,k=Math.min(1,M/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)),c=document.createElement('canvas');
      c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
      const old=db.biz.logo;db.biz.logo=c.toDataURL('image/png');
      try{save()}catch(e){db.biz.logo=old;return toast('Penyimpanan penuh, logo tidak tersimpan.')}
      $('lbox').innerHTML=lview();el.value='';toast('Logo tersimpan.')};
    im.src=rd.result};
  rd.readAsDataURL(f)}
function ldel(){delete db.biz.logo;save();$('lbox').innerHTML=lview();toast('Logo dihapus.')}
function bsave(){const n=$('bn').value.trim();if(!n)return setM('Nama usaha wajib diisi.');Object.assign(db.biz,{name:n,owner:$('bo').value.trim(),contact:$('bc').value.trim(),addr:$('ba').value.trim()});save();$('m').className='ok';setM('Tersimpan.')}
let busy=false;
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
const G='<div style="display:grid;gap:8px;margin-top:12px">',RB='style="background:var(--r)"';
function pUsed(id){return db.txs.filter(x=>x.items.some(i=>i.pid===id)).length}
function pmenu(id){const p=db.products.find(x=>x.id===id);ov(`<h2>${esc(p.name)}</h2><div class="mut">${esc(p.code)}</div>${G}<button class="btn s" onclick="cl();pform('${id}')">Edit</button><button class="btn s" onclick="cl();ptog('${id}')">${p.active?'Nonaktifkan':p.archived?'Aktifkan kembali':'Aktifkan'}</button><button class="btn s" style="color:var(--r)" onclick="pdel('${id}')">${pUsed(id)?'Arsipkan…':'Hapus…'}</button><button class="btn s" onclick="cl()">Tutup</button></div>`)}
function pdel(id){const p=db.products.find(x=>x.id===id),n=pUsed(id);
  ov(n?`<h2>Arsipkan produk?</h2><p>Produk <b>${esc(p.name)}</b> sudah dipakai di ${n} transaksi, jadi tidak bisa dihapus. Produk akan diarsipkan: tidak muncul di Kasir, sedangkan riwayat transaksi lama tidak berubah.</p><div class="err" id="m"></div><div class="row"><button class="btn" id="ok" onclick="pdo('${id}')">Arsipkan</button><button class="btn s" onclick="cl()">Batal</button></div>`
  :`<h2>Hapus produk?</h2><p>Produk <b>${esc(p.name)}</b> belum pernah dipakai di transaksi dan akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.</p><div class="err" id="m"></div><div class="row"><button class="btn" ${RB} id="ok" onclick="pdo('${id}')">Hapus permanen</button><button class="btn s" onclick="cl()">Batal</button></div>`)}
function pdo(id){if(busy)return;busy=true;const b=$('ok');if(b)b.disabled=true;const snap=JSON.stringify(db.products);let msg='';
  try{const i=db.products.findIndex(x=>x.id===id);if(i<0)throw new Error('tidak ditemukan');
    if(pUsed(id)){Object.assign(db.products[i],{archived:true,active:false});msg='Produk diarsipkan.'}else{db.products.splice(i,1);msg='Produk dihapus.'}
    save();cl();render();toast(msg)}
  catch(e){db.products=JSON.parse(snap);setM('Gagal menyimpan perubahan. Tidak ada data yang diubah.')}
  finally{busy=false}}
function expWarn(x){return x.exp?`<div class="warn"><b>Sudah pernah diekspor ke CSV</b> (${x.exp.slice(0,10)}, penanda lokal). Perubahan di sini tidak mengubah file CSV yang sudah diunduh, maupun data di sistem lain yang mungkin sudah mengimpornya.</div>`:''}
function erpLocked(x){return !!(x&&(x.erpPostedAt||PosERP.isPosted(x.id,erpBiz&&erpBiz.id)))}
function erpLockNote(){return `<div class="warn"><b>Sudah tercatat di ERP.</b> Jurnal penjualan dan HPP tidak diubah dari POS. Buat jurnal koreksi di ERP bila transaksi perlu dibatalkan.</div>`}
function txmenu(id){const x=db.txs.find(t=>t.id===id),lock=erpLocked(x);ov(`<h2>${esc(x.id)}</h2><div class="mut">${rp(x.total)}${x.void?' · Dibatalkan':''}${lock?' · ERP':''}</div>${lock?erpLockNote():''}${G}<button class="btn s" onclick="cl();detail('${id}')">Lihat / cetak struk</button>${(lock||x.void)?'':`<button class="btn s" onclick="cl();postLocal('${id}')">Catat ke ERP</button>`}${(x.void||lock)?'':`<button class="btn s" onclick="tvoid('${id}')">Batalkan transaksi…</button>`}${lock?'':`<button class="btn s" style="color:var(--r)" onclick="tdel('${id}')">Hapus permanen…</button>`}<button class="btn s" onclick="cl()">Tutup</button></div>`)}
function tvoid(id){const x=db.txs.find(t=>t.id===id);if(erpLocked(x))return ov(`<h2>Tidak bisa dibatalkan dari POS</h2>${erpLockNote()}<button class="btn" onclick="cl()">Tutup</button>`);ov(`<h2>Batalkan transaksi?</h2><p><b>${esc(x.id)}</b><br>Total ${rp(x.total)}</p><p>Transaksi tetap tersimpan di riwayat dengan status Dibatalkan, tidak dihitung dalam omzet, dan tidak ikut ekspor CSV berikutnya.</p>${expWarn(x)}<div class="err" id="m"></div><div class="row"><button class="btn" id="ok" onclick="tdo('${id}','void')">Ya, batalkan</button><button class="btn s" onclick="cl()">Kembali</button></div>`)}
function tdel(id){const x=db.txs.find(t=>t.id===id);if(erpLocked(x))return ov(`<h2>Tidak bisa dihapus dari POS</h2>${erpLockNote()}<button class="btn" onclick="cl()">Tutup</button>`);ov(`<h2>Hapus transaksi?</h2><p><b>${esc(x.id)}</b><br>Total ${rp(x.total)}</p><p>Transaksi beserta semua rincian itemnya dihapus permanen dan tidak dapat dikembalikan. Alternatif yang lebih aman: batalkan transaksi.</p>${expWarn(x)}${x.exp?'<label style="display:flex;gap:8px;align-items:center;color:var(--t)"><input type="checkbox" style="width:auto;min-height:0" onchange="$(\'ok\').disabled=!this.checked"> Saya mengerti</label>':''}<div class="err" id="m"></div><div class="row"><button class="btn" ${RB} id="ok" ${x.exp?'disabled':''} onclick="tdo('${id}','del')">Hapus permanen</button><button class="btn s" onclick="cl()">Batal</button></div>`)}
function tdo(id,mode){if(busy)return;const target=db.txs.find(x=>x.id===id);if(erpLocked(target))return;busy=true;const b=$('ok');if(b)b.disabled=true;const snap=JSON.stringify(db.txs);
  try{const i=db.txs.findIndex(x=>x.id===id);if(i<0)throw new Error('tidak ditemukan');
    if(mode==='del')db.txs.splice(i,1);else Object.assign(db.txs[i],{void:true,voidAt:new Date().toISOString()});
    save();cl();render();toast(mode==='del'?'Transaksi dihapus.':'Transaksi dibatalkan.')}
  catch(e){db.txs=JSON.parse(snap);setM('Gagal menyimpan perubahan. Tidak ada data yang diubah.')}
  finally{busy=false}}
async function loadBusiness(id){ERP.setActiveBusiness(id);const biz=ERP.getActiveBusiness();if(!biz)throw new Error('Usaha aktif tidak ditemukan di ERP.');erpBiz=biz;accounts=ERP.getActiveAccounts();catalog=[];catalogCachedAt='';mapping={};db=loadDb();db.biz=Object.assign({},db.biz||{},{id:biz.id,name:biz.name,owner:(erpUser&&erpUser.email)||'',contact:'',addr:biz.address||'',period:biz.period||''});save();
  try{catalog=await PosERP.loadCatalog(id);saveCatalogCache(id,catalog)}
  catch(e){const cached=readCatalogCache(id);if(!cached)throw e;catalog=cached.items;catalogCachedAt=cached.at||'offline'}
  mapping=PosERP.loadMapping(id);if(!PosERP.hasAnyMapping(mapping,accounts))mapping=PosERP.guessMapping(accounts,PosERP.METHODS);booting=false;bootError='';render()}
async function boot(){booting=true;bootError='';render();
  if(typeof ERPAuth==='undefined'||typeof ERP==='undefined'||typeof SaleCore==='undefined'||!window.PosERP){booting=false;bootError='Layanan login atau mesin ERP tidak termuat. Periksa koneksi lalu muat ulang halaman.';render();return}
  ERPAuth.onReady(async function(user){erpUser=user||null;
    try{await PosERP.syncERP();const biz=ERP.getActiveBusiness();if(!biz){erpBiz=null;db=null;booting=false;render();return}await loadBusiness(biz.id)}
    catch(e){bootError=ERP.friendlyError?ERP.friendlyError(e):String((e&&e.message)||e);booting=false;render()}})}
function ov(h){$('ov').innerHTML=`<div class="ov" onclick="if(event.target===this)cl()"><div class="md">${h}</div></div>`}
function cl(){$('ov').innerHTML=''}
regSW();
boot();
</script></body></html>
