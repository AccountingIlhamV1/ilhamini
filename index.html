<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasir Catat.in</title>
<meta name="description" content="Kasir browser sederhana untuk mencatat penjualan dan harga modal langsung ke Ilham ERP.">
<meta name="theme-color" content="#12305c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Catat.in">
<style>
:root{--n:#12305c;--b:#2f7de1;--bg:#f5f7fb;--l:#e1e7f0;--t:#1b2433;--m:#5d6b82;--r:#c0392b;--g:#1d8a52}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--t);background:var(--bg);overflow-wrap:anywhere}
button,input,select{font:inherit}h1{font-size:1.35rem;margin:.1em 0 .5em}h2{font-size:1.05rem;margin:0}
.top{background:var(--n);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 14px;position:sticky;top:0;z-index:6;min-height:54px}
.logo{font-weight:700;font-size:1.2rem}.logo b{color:#7db4ff}
.hb{background:none;border:1px solid #4a6fa5;color:#fff;border-radius:8px;width:44px;height:40px;font-size:1.3rem;cursor:pointer}
.top nav{display:none;position:absolute;top:100%;right:8px;width:min(240px,calc(100vw - 16px));flex-direction:column;background:var(--n);padding:6px;border-radius:0 0 12px 12px;box-shadow:0 8px 20px #0004}.top nav.open{display:flex}
.top a{color:#cfe0fb;text-decoration:none;padding:10px 12px;border-radius:8px;cursor:pointer}.top a.on{background:#25508f;color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:14px}.grid .card{margin:0;padding:14px}.stat small{color:var(--m)}.stat div{font-size:clamp(1.05rem,4.6vw,1.45rem);font-weight:700;color:var(--n)}.stat.w{grid-column:1/-1}
.pos{display:grid;gap:14px;grid-template-columns:1fr}
label{display:block;font-size:.9rem;color:var(--m);margin:10px 0 3px}input,select{width:100%;min-height:44px;padding:9px 12px;border:1px solid #b9c5d8;border-radius:10px;background:#fff}
input:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:600}.btn.s{background:#fff;color:var(--n);border:1px solid #b9c5d8}.btn:disabled{opacity:.45;cursor:not-allowed}.sm{padding:4px 12px;min-height:36px;font-size:.88rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.err{color:var(--r);font-size:.9rem;margin:6px 0;min-height:1px}.ok{color:var(--g)}.mut{color:var(--m);font-size:.9rem}
.pl{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));max-height:42vh;overflow:auto;margin-top:10px}.pi{text-align:left;background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px;cursor:pointer;min-height:76px}.pi:hover{border-color:var(--b)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--l);cursor:pointer}.li:last-child{border:0}
.ci{padding:10px 0;border-bottom:1px solid var(--l)}.ci1,.ci2{display:flex;justify-content:space-between;align-items:center;gap:8px}.ci2{margin:6px 0}.st{display:flex;gap:4px;align-items:center}.st .btn{width:40px;padding:0}.st input{width:56px;text-align:center;padding:8px 4px}
details summary{cursor:pointer;padding:4px 0;color:var(--n);font-weight:600}.flt{padding:10px 16px;margin:10px 0}
.tag{background:#fff3cd;color:#7a5b00;border-radius:6px;padding:2px 8px;font-size:.8rem;font-weight:600}.warn{background:#fff8e1;border:1px solid #f0d78a;border-radius:10px;padding:10px;font-size:.9rem;margin-bottom:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--l);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:4}.tot{font-size:1.4rem;font-weight:700;color:var(--n)}.bar .btn{min-width:120px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:8px 6px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}th{color:var(--m)}
.auth{max-width:420px;margin:5vh auto;padding:0 16px}.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.md{background:#fff;border-radius:14px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
input[readonly]{background:#eef2f8;color:var(--m)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw}.rcpt{font-family:ui-monospace,monospace;font-size:.85rem}.rcpt hr{border:0;border-top:1px dashed #888}
@media(min-width:800px){.hb{display:none}.top{justify-content:flex-start;gap:24px}.top nav{display:flex;position:static;flex-direction:row;flex-wrap:wrap;width:auto;background:none;box-shadow:none;padding:0;flex:1}.top nav a:last-child{margin-left:auto}.pos{grid-template-columns:1.2fr 1fr}.grid{grid-template-columns:repeat(4,1fr)}.stat.w{grid-column:auto}}@media(min-width:1024px){main{max-width:1180px}}
.plogo{display:block;max-width:160px;max-height:96px;margin:6px 0 8px;padding:4px;border:1px solid var(--l);border-radius:8px;background:#fff}.rlogo{display:block;margin:0 auto 6px;max-width:120px;max-height:56px}
.pwa{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pwa>div:first-child{flex:1;min-width:180px}.pwa .row{flex-wrap:nowrap}
@media print{body *{visibility:hidden}.rcpt,.rcpt *{visibility:visible}.rcpt{position:absolute;left:0;top:0;width:100%}.ov{background:none}}
</style></head><body><div id="app"></div><div id="ov"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/sale-core.js"></script>
<script src="assets/cash-core.js"></script>
<script src="assets/parser.js"></script>
<script src="assets/app.js"></script>
<script src="assets/pos-erp.js"></script>
<script>
const K='catatin.v1';
let db=null,cart=[],pay={m:'Tunai',paid:''},saving=false,q='',pq='',hf={q:'',a:'',b:''},loading=false;
let erpUser=null,erpBiz=null,accounts=[],catalog=[],mapping={},bootError='',booting=true,catalogCachedAt='';
function legacyDb(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&Array.isArray(d.txs)&&d.biz)return d}catch(e){}return null}
function storeKey(){return 'catatin.v2.'+((erpUser&&erpUser.id)||'anon')+'.'+((erpBiz&&erpBiz.id)||'none')}
function loadDb(){try{const d=JSON.parse(localStorage.getItem(storeKey()));if(d&&Array.isArray(d.txs)&&Array.isArray(d.products)&&d.biz)return d}catch(e){}return {v:2,biz:{},products:[],txs:[],seq:{}}}
function save(){if(!db)return;db.erpUserId=(erpUser&&erpUser.id)||null;db.erpBusinessId=(erpBiz&&erpBiz.id)||null;localStorage.setItem(storeKey(),JSON.stringify(db))}
const $=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IDR=new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0,minimumFractionDigits:0}),rp=n=>IDR.format(n).replace(/\s/g,''),p2=n=>String(n).padStart(2,'0');
const num=s=>Number(String(s).replace(/\D/g,''))||0,fmt=n=>n===''||n==null?'':Number(n).toLocaleString('id-ID');
function mask(el){const pos=el.selectionStart,keep=el.value.slice(0,pos).replace(/\D/g,'').length,d=el.value.replace(/\D/g,'').slice(0,12).replace(/^0+(?=\d)/,'');el.value=d?Number(d).toLocaleString('id-ID'):'';let c=0,i=0;while(i<el.value.length&&c<keep){if(/\d/.test(el.value[i]))c++;i++}el.setSelectionRange(i,i)}
const dstr=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),tstr=d=>p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).slice(0,8).toUpperCase();
async function hash(s,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const demoNote='<div class="warn"><b>Mode Demo.</b> Akun dan data hanya tersimpan di browser perangkat ini. Ini bukan autentikasi produksi, dan data tidak dicadangkan secara online.</div>';
function go(h){location.hash=h}
window.onhashchange=render;
function render(){
  if(booting){$('app').innerHTML='<div class="auth"><div class="card"><h1>Memuat data ERP…</h1><p class="mut">Mengambil usaha, akun, produk, dan resep.</p></div></div>';return}
  if(bootError){$('app').innerHTML=`<div class="auth"><div class="card"><h1>Tidak bisa memuat</h1><div class="err">${esc(bootError)}</div><div class="row"><button class="btn" onclick="location.reload()">Coba lagi</button><button class="btn s" onclick="logout()">Keluar</button></div><p class="mut">Kalau masalah berlanjut, buka ERP untuk memeriksa akun dan koneksi.</p></div></div>`;return}
  if(!erpBiz||!db){$('app').innerHTML=noBusinessPage();return}
  const v=(location.hash||'#').slice(1)||'dash';
  const nav=[['dash','Beranda'],['pos','Kasir'],['kas','Uang'],['products','Katalog'],['history','Riwayat'],['setup','Pengaturan'],['profile','Profil']];
  const pg={dash,pos,kas:kasPage,products,history,setup,profile}[v]||dash;
  $('app').innerHTML=`<header class="top"><span class="logo">catat<b>.in</b></span><button class="hb" aria-label="Menu" aria-expanded="false" onclick="tm(this)">☰</button><nav id="nv">${nav.map(([k,t])=>`<a class="${k===v?'on':''}" onclick="gn('${k}')">${t}</a>`).join('')}<a onclick="logout()">Keluar</a></nav></header><main><div id="netbar"></div>${pg()}</main>`;
  if(v==='pos')list();
  if(v==='kas')kasPrev();
  netbar();
}
function tm(b){const o=$('nv').classList.toggle('open');b.setAttribute('aria-expanded',o)}
function gn(k){if(location.hash==='#'+k)render();else go(k)}
/* AUTH (Supabase ERP) */
function loginPage(msg=''){$('app').innerHTML=`<div class="auth"><div class="logo" style="font-size:1.8rem;color:var(--n)">catat<b style="color:var(--b)">.in</b></div><h1>Masuk ke Kasir</h1><div class="warn">Kasir memakai akun Ilham ERP yang sama. Jika halaman tidak berpindah, buka <a href="login.html">halaman masuk</a>.</div><div class="err">${esc(msg)}</div></div>`}
function regPage(){loginPage('Pendaftaran dilakukan di halaman masuk Ilham ERP.')}
function logout(){if(window.ERPAuth)return ERPAuth.signOut();location.replace('login.html')}
function noBusinessPage(){return `<div class="auth"><div class="card"><h1>Belum ada usaha</h1><p>Akun ini belum punya usaha aktif di ERP. Buat atau pilih usaha dulu.</p><p><a class="btn" href="https://accountingilhamv1.github.io/Ilhamoke/business.html">Buka Data Usaha</a></p><p class="mut">Setelah itu kembali ke halaman Kasir.</p></div></div>`}
function setM(t){const e=$('m');if(e)e.textContent=t}
/* PWA, INSTALASI, DAN STATUS KONEKSI */
let installEvt=null,pwaInstalled=false;
function onlineNow(){return typeof navigator==='undefined'||navigator.onLine!==false}
function standalone(){try{return !!((window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true)}catch(e){return false}}
function offlineWarn(){return `<div class="warn" style="margin:0 0 14px"><b>Tidak ada koneksi internet.</b> Transaksi baru belum bisa disimpan sampai koneksi kembali. Data yang sudah tampil tetap bisa dilihat, tetapi jangan menutup aplikasi sebelum transaksi tercatat.</div>`}
function netbar(){const e=$('netbar');if(!e)return;e.innerHTML=onlineNow()?'':offlineWarn()}
function installDismissed(){try{return localStorage.getItem('catatin.pwa.dismiss')==='1'}catch(e){return false}}
function installCard(){if(standalone()||pwaInstalled||installDismissed())return '';
  return `<div class="card pwa"><div><b>Pasang aplikasi kasir</b><div class="mut">Buka kasir langsung dari layar utama, seperti aplikasi biasa. Data tetap tersimpan di Ilham ERP.</div></div><div class="row"><button class="btn" onclick="installApp()">Pasang</button><button class="btn s sm" onclick="dismissInstall()">Nanti</button></div></div>`}
function installApp(){if(installEvt){const e=installEvt;installEvt=null;e.prompt();const after=()=>{if(!standalone()&&!pwaInstalled)render()};if(e.userChoice&&e.userChoice.then)e.userChoice.then(after,after);else after();return}
  ov(`<h2>Pasang aplikasi kasir</h2><p>Browser ini belum menampilkan tombol pasang otomatis. Ikuti langkah berikut:</p><ol style="margin:6px 0 0 18px;padding:0"><li><b>Android Chrome:</b> menu ⋮ → “Pasang aplikasi” atau “Tambahkan ke Layar utama”.</li><li><b>iPhone/iPad Safari:</b> tombol Bagikan → “Tambahkan ke Layar Utama”.</li><li><b>Desktop Chrome/Edge:</b> ikon pasang di kanan address bar.</li></ol><p class="mut">Aplikasi harus dibuka lewat alamat https:// (atau localhost). Setelah terpasang, kasir bisa dibuka tanpa address bar. Login dan penyimpanan transaksi tetap memerlukan internet.</p><button class="btn" style="margin-top:12px" onclick="cl()">Mengerti</button>`)}
function dismissInstall(){try{localStorage.setItem('catatin.pwa.dismiss','1')}catch(e){}render()}
function regSW(){if(typeof navigator==='undefined'||!navigator.serviceWorker||!/^https?:$/.test(location.protocol))return;
  navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(e){console.warn('Service worker gagal dipasang:',e)})}
if(window.addEventListener){
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;if(!standalone()&&!installDismissed())render()});
  window.addEventListener('appinstalled',function(){installEvt=null;pwaInstalled=true;toast('Aplikasi kasir terpasang.');render()});
  window.addEventListener('online',function(){netbar();toast('Koneksi kembali.')});
  window.addEventListener('offline',function(){netbar();toast('Tidak ada koneksi internet.')});
}
/* SALINAN KATALOG UNTUK DIBUKA SAAT OFFLINE */
const CATCACHE='catatin.catalog.';
function saveCatalogCache(id,items){try{localStorage.setItem(CATCACHE+id,JSON.stringify({at:new Date().toISOString(),items}))}catch(e){}}
function readCatalogCache(id){try{const d=JSON.parse(localStorage.getItem(CATCACHE+id));if(d&&Array.isArray(d.items)&&d.items.length)return d}catch(e){}return null}
/* DASHBOARD */
function legacyBanner(){const old=legacyDb();if(!old||!Array.isArray(old.txs)||!old.txs.length)return '';if(old.importedTo&&old.importedTo[storeKey()])return '';
  return `<div class="warn"><b>Data lokal lama ditemukan.</b> ${old.txs.length} transaksi dari aplikasi Kasir sebelumnya belum ada di usaha ini. <button class="btn s sm" onclick="importLegacy()">Salin ke usaha ini</button> <button class="btn s sm" onclick="skipLegacy()">Abaikan</button><div class="mut">Data lama tidak dihapus. Transaksi yang disalin tetap berstatus lokal sampai dicatat ke ERP.</div></div>`}
function importLegacy(){const old=legacyDb();if(!old||!Array.isArray(old.txs))return;if(!confirm('Salin '+old.txs.length+' transaksi lokal lama ke usaha '+erpBiz.name+'? Data lama tetap disimpan.'))return;
  const seen=new Set(db.txs.map(t=>String(t&&t.id)));let n=0;(old.txs||[]).forEach(t=>{if(t&&t.id&&!seen.has(String(t.id))){db.txs.push(Object.assign({},t,{legacyLocal:true}));seen.add(String(t.id));n++}});
  if(old.biz&&old.biz.logo&&!db.biz.logo)db.biz.logo=old.biz.logo;
  Object.keys(old.seq||{}).forEach(k=>{db.seq[k]=Math.max(Number(db.seq[k])||0,Number(old.seq[k])||0)});
  old.importedTo=old.importedTo||{};old.importedTo[storeKey()]=new Date().toISOString();try{localStorage.setItem(K,JSON.stringify(old))}catch(e){}
  save();render();toast(n+' transaksi lama disalin.')}
function skipLegacy(){const old=legacyDb();if(!old)return;old.importedTo=old.importedTo||{};old.importedTo[storeKey()]=new Date().toISOString();try{localStorage.setItem(K,JSON.stringify(old))}catch(e){}render()}
/* DASHBOARD */
let sumP='today';
function shiftYmd(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)}
/* Ringkasan dari data ERP (semua perangkat). Hanya membaca transaksi berstatus posted
   yang sudah ada di ERP; tidak membuat jurnal, HPP, atau stok baru. Cara hitung sama dengan bot Telegram. */
function erpSummary(p,today){
  today=today||dstr(new Date());let a=today,b=today;
  if(p==='yday'){a=b=shiftYmd(today,-1)}else if(p==='week'){a=shiftYmd(today,-6)}
  const kind=new Map(),hpp=new Set(),cash=new Set();
  accounts.forEach(x=>{const id=String(x.id),nm=String(x.name||'').toLowerCase().replace(/^[-*\s]+/,'');
    if(ERP.REVENUE_GROUPS.includes(x.group))kind.set(id,'p');
    else if(ERP.EXPENSE_GROUPS.includes(x.group)){kind.set(id,'b');if(/^harga pokok penjualan/.test(nm))hpp.add(id)}
    if(x.isCash)cash.add(id)});
  let revenue=0,count=0,cogs=0,expense=0,kas=0;
  ERP.getActiveTransactions().forEach(t=>{
    const amt=Number(t.amount)||0,d=String(t.debitAccountId),c=String(t.creditAccountId);
    if(cash.has(d))kas+=amt;if(cash.has(c))kas-=amt;
    if(!(t.date>=a&&t.date<=b))return;
    if(kind.get(c)==='p'){revenue+=amt;count++}
    if(kind.get(d)==='p')revenue-=amt;
    if(kind.get(d)==='b'){if(hpp.has(d))cogs+=amt;else expense+=amt}
    if(kind.get(c)==='b'){if(hpp.has(c))cogs-=amt;else expense-=amt}});
  const gross=revenue-cogs;
  return {from:a,to:b,revenue,count,cogs,expense,gross,net:gross-expense,kas,noCost:cogs===0&&revenue>0};
}
function sumSet(p){sumP=p;render()}
function sumCard(){let s;try{s=erpSummary(sumP)}catch(e){return ''}
  const ttl={today:'hari ini',yday:'kemarin',week:'7 hari terakhir'}[sumP]||'hari ini',
    btn=(k,t)=>`<button class="btn ${sumP===k?'':'s'} sm" onclick="sumSet('${k}')">${t}</button>`,
    line=(t,v)=>`<div class="row sp"><span>${t}</span><b>${v}</b></div>`;
  return `<div class="card"><h2>Ringkasan ${ttl}</h2><div class="row" style="margin-bottom:8px">${btn('today','Hari ini')}${btn('yday','Kemarin')}${btn('week','7 hari')}</div>`+
    line('Penjualan ('+s.count+' transaksi)',rp(s.revenue))+line('Modal produk',s.noCost?'belum tercatat':rp(s.cogs))+line('Untung kotor',rp(s.gross))+line('Biaya usaha',rp(s.expense))+line('Untung bersih',rp(s.net))+line('Uang kas &amp; bank',rp(s.kas))+
    (s.noCost?'<p class="mut">Modal produk belum tercatat, jadi untungnya belum pasti.</p>':'')+
    '<p class="mut">Dihitung dari data di ERP, jadi menyatukan semua perangkat.</p></div>'}
function dash(){const t=dstr(new Date()),tx=db.txs.filter(x=>x.date===t&&!x.void),sum=tx.reduce((a,x)=>a+x.total,0),act=catalog.filter(p=>p.active).length;
  return `<div class="row sp"><h1>Beranda</h1><button class="btn" onclick="go('pos')">Mulai transaksi</button></div><p class="mut" style="margin-top:-6px">${esc(db.biz.name)}${erpUser&&erpUser.email?' · '+esc(erpUser.email):''}</p>${installCard()}${legacyBanner()}${catalogCachedAt?`<div class="warn">Katalog sedang memakai salinan terakhir (${esc(String(catalogCachedAt).slice(0,10))}) karena server belum bisa dihubungi. Harga dan harga modal bisa berubah di Ilham ERP.</div>`:''}
${sumCard()}<div class="grid"><div class="card stat w"><small>Omzet hari ini di perangkat ini (bukan laba)</small><div>${rp(sum)}</div></div><div class="card stat"><small>Transaksi lokal hari ini</small><div>${tx.length}</div></div><div class="card stat"><small>Rata-rata</small><div>${rp(tx.length?Math.round(sum/tx.length):0)}</div></div><div class="card stat"><small>Produk aktif di ERP</small><div>${act}</div></div></div>
<div class="card"><div class="row sp"><h2>Transaksi terbaru</h2><a href="#history">Lihat semua</a></div>${txTable(db.txs.slice(-5).reverse())}</div>
<div class="mut">Penjualan langsung tersimpan sebagai catatan di Ilham ERP, dan stok bahan berkurang sesuai resep produk.</div>`}
function txTable(a,m){if(!a.length)return '<p class="mut">Belum ada transaksi. Mulai dari halaman Kasir.</p>';

function qtyTxt(n){return String(+Number(n).toFixed(4)).replace('.',',')}
async function useStock(bizId,items){
  const out={msg:'',warn:''};
  try{
    const sb=ERPAuth.client,sold=new Map();
    items.forEach(i=>sold.set(i.pid,(sold.get(i.pid)||0)+i.qty));
    const ids=[...sold.keys()];if(!ids.length)return out;
    const rc=await sb.from('product_recipe').select('product_id,material_id,qty').eq('business_id',bizId).in('product_id',ids);
    if(rc.error)throw rc.error;
    const use=new Map();
    (rc.data||[]).forEach(l=>{const q=(sold.get(l.product_id)||0)*(Number(l.qty)||0);if(q>0)use.set(l.material_id,(use.get(l.material_id)||0)+q)});
    if(!use.size)return out;
    const done=[],failed=[];
    for(const [mid,q] of use){
      let ok=false,name='',unit='',stock=0,last;
      for(let t=0;t<3&&!ok;t++){
        const g=await sb.from('materials').select('name,unit,stock').eq('id',mid).eq('business_id',bizId).limit(1);
        if(g.error||!g.data||!g.data.length)break;
        const raw=g.data[0].stock;
        if(t>0&&raw===last)break; /* stok tidak berubah tapi tulis gagal: bukan bentrok, kemungkinan tidak ada izin */
        last=raw;name=g.data[0].name||'';unit=g.data[0].unit||'';
        const next=Math.round(((Number(raw)||0)-q)*10000)/10000;
        let qb=sb.from('materials').update({stock:next}).eq('id',mid).eq('business_id',bizId);
        qb=raw===null||raw===undefined?qb.is('stock',null):qb.eq('stock',raw); /* hanya menulis kalau stok belum diubah perangkat lain */
        const up=await qb.select('id');
        if(up.error)break;
        if(up.data&&up.data.length){ok=true;stock=next}
      }
      if(ok)done.push({name,unit,stock});else failed.push(name||'bahan');
    }
    if(done.length){out.msg='<br>Sisa stok: '+done.map(x=>esc(x.name)+' '+qtyTxt(x.stock)+' '+esc(x.unit)).join(', ')+'.';
      if(done.some(x=>x.stock<0))out.warn+=' Ada stok minus. Isi stok awal bahan di ERP.'}
    if(failed.length)out.warn+=' Stok belum berhasil diperbarui untuk: '+failed.join(', ')+'. Cek di ERP, menu Bahan & Produk.';
  }catch(e){out.warn=' Stok bahan belum berhasil diperbarui. Cek di ERP, menu Bahan & Produk.'}
  return out}

  kAuto={p,type};return kAuto}

async function kasWrite(e){if(saving)return false;if(!onlineNow()){kasMsg('Tidak ada koneksi internet. Catatan belum tersimpan.');return false}
  const date=e.date,amount=Number(e.amount);
  const key='kas'+date.replace(/-/g,''),seq=((db.seq[key]||0)+1),id='KAS-'+date.replace(/-/g,'')+'-'+String(seq).padStart(4,'0'),b=$('kok')||$('kgo');
  if(b)b.disabled=true;saving=true;
  try{const res=await PosERP.postCash(erpBiz.id,{id,type:e.type,date:date,amount:amount,note:e.note,debitAccountId:e.debitAccountId,creditAccountId:e.creditAccountId});
    if(!res.ok){kasMsg(plain((res.errors||['Catatan gagal disimpan.']).join(' ')));return false}
    db.seq[key]=seq;save();
    if(e.take){kAuto=null}else{kf.date=dstr(new Date());kf.debit='';kf.credit=''}
    cl();render();
    const t=CashCore.typeOf(e.type);
    toast(res.duplicate?'Catatan ini sudah tersimpan di Ilham ERP.':'Tersimpan: '+(t?t.label:'Catatan')+' '+rp(amount));
    return true}
  catch(err){kasMsg(ERP.friendlyError?ERP.friendlyError(err):String((err&&err.message)||err));return false}

function unpostedLocal(){return db.txs.filter(x=>x&&!x.void&&!erpLocked(x))}
function txCogs(x){try{return SaleCore.cogsFromItems(x.items).total}catch(e){return 0}}
function localPostBanner(){const list=unpostedLocal();if(!list.length)return '';
  return `<div class="warn"><b>${list.length} transaksi lokal belum tercatat di ERP.</b> Transaksi ini baru tersimpan di browser ini dan belum masuk catatan Ilham ERP. <div class="row" style="margin-top:6px"><button class="btn sm" onclick="postLocal()">Simpan ke ERP</button></div><div class="mut">Stok tidak berubah. Setelah tersimpan, transaksi tidak bisa dibatalkan atau dihapus dari kasir.</div></div>`}
function postLocal(id){const list=(id?db.txs.filter(x=>x.id===id):unpostedLocal()).filter(x=>x&&!x.void&&!erpLocked(x));
  if(!list.length)return toast('Tidak ada transaksi lokal yang perlu dicatat.');
  if(!onlineNow())return toast('Tidak ada koneksi internet. Transaksi belum dicatat ke ERP.');
  const total=list.reduce((s,x)=>s+x.total,0);
  ov(`<h2>Simpan ke Ilham ERP</h2><p>${list.length} transaksi lokal (${rp(total)}) akan disimpan sebagai catatan penjualan${list.some(x=>txCogs(x)>0)?' dan harga modal':''} di <b>${esc(erpBiz.name)}</b>.</p><div class="warn">Catatan yang sudah tersimpan tidak bisa dibatalkan dari kasir. Stok bahan tetap tidak berubah. Kalau perlu dikoreksi, lakukan di Ilham ERP.</div><div id="pm" class="mut"></div><div class="err" id="m"></div><div class="row"><button class="btn" id="pok" onclick="postLocalDo(${JSON.stringify(id||null)})">Catat sekarang</button><button class="btn s" onclick="cl()">Batal</button></div>`)}
async function postLocalDo(id){if(saving)return;const list=(id?db.txs.filter(x=>x.id===id):unpostedLocal()).filter(x=>x&&!x.void&&!erpLocked(x));
  if(!list.length)return cl();const btn=$('pok'),msg=$('pm'),err=$('m');
  if(!onlineNow()){if(err)err.textContent='Tidak ada koneksi internet. Transaksi belum dicatat ke ERP.';return}
  if(btn)btn.disabled=true;saving=true;let done=0;const problems=[];
  for(let k=0;k<list.length;k++){const x=list[k];if(msg)msg.textContent='Mencatat '+(k+1)+' dari '+list.length+'…';
    try{const cogs=txCogs(x);
      const mapProblems=PosERP.mappingProblems(mapping,accounts,x.method,cogs,erpBiz.id);
      if(mapProblems.length){problems.push(x.id+': '+mapProblems.join(' '));continue}
      const sale={id:x.id,date:x.date,time:x.time,method:x.method,items:x.items,total:x.total,paid:x.paid,change:x.change,cogs:cogs};
      const res=await PosERP.postSale(erpBiz.id,sale,mapping);
      if(!res.ok){problems.push(x.id+': '+(res.errors||['Gagal menyimpan ke ERP.']).join(' '));continue}
      Object.assign(x,{erpPostedAt:new Date().toISOString(),erpBusinessId:erpBiz.id,erpCogs:res.cogs,erpDuplicate:!!res.duplicate,erpWarning:plain((res.warnings||[]).join(' ')),cogs:cogs});
      try{save()}catch(e){}
      done++;
    }catch(e){problems.push(x.id+': '+(ERP.friendlyError?ERP.friendlyError(e):String((e&&e.message)||e)))}
  }
  saving=false;cl();render();
  if(!problems.length)return toast(done+' transaksi dicatat ke ERP.');
  ov(`<h2>Sebagian belum tercatat</h2><p><b>${done}</b> transaksi berhasil dicatat, <b>${problems.length}</b> belum.</p><div class="err">${esc(problems.slice(0,4).join(' '))}${problems.length>4?' …':''}</div><p class="mut">Periksa koneksi dan Pengaturan pencatatan, lalu coba lagi dari Riwayat. Transaksi yang sudah berhasil tidak akan ditulis dua kali.</p><button class="btn" onclick="cl()">Tutup</button>`)}

function lupload(el){const f=el.files&&el.files[0];if(!f)return;
  if(!/^image\/(png|jpe?g|webp|gif)$/i.test(f.type)){el.value='';return toast('File harus berupa gambar (PNG, JPG, atau WebP).')}
  if(f.size>8*1024*1024){el.value='';return toast('Ukuran gambar maksimal 8 MB.')}
  const rd=new FileReader();rd.onerror=()=>toast('Gagal membaca gambar.');
  rd.onload=()=>{const im=new Image();im.onerror=()=>toast('Gambar tidak bisa dibuka.');
    im.onload=()=>{const M=256,k=Math.min(1,M/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)),c=document.createElement('canvas');
      c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
      const old=db.biz.logo;db.biz.logo=c.toDataURL('image/png');
      try{save()}catch(e){db.biz.logo=old;return toast('Penyimpanan penuh, logo tidak tersimpan.')}
      $('lbox').innerHTML=lview();el.value='';toast('Logo tersimpan.')};
    im.src=rd.result};
  rd.readAsDataURL(f)}

function erpLockNote(){return `<div class="warn"><b>Sudah tersimpan di Ilham ERP.</b> Catatan penjualan dan harga modal tidak bisa diubah dari kasir. Kalau transaksi perlu dibatalkan, lakukan koreksi di Ilham ERP.</div>`}
function txmenu(id){const x=db.txs.find(t=>t.id===id),lock=erpLocked(x);ov(`<h2>${esc(x.id)}</h2><div class="mut">${rp(x.total)}${x.void?' · Dibatalkan':''}${lock?' · ERP':''}</div>${lock?erpLockNote():''}${G}<button class="btn s" onclick="cl();detail('${id}')">Lihat / cetak struk</button>${(lock||x.void)?'':`<button class="btn s" onclick="cl();postLocal('${id}')">Simpan ke ERP</button>`}${(x.void||lock)?'':`<button class="btn s" onclick="tvoid('${id}')">Batalkan transaksi…</button>`}${lock?'':`<button class="btn s" style="color:var(--r)" onclick="tdel('${id}')">Hapus permanen…</button>`}<button class="btn s" onclick="cl()">Tutup</button></div>`)}
function tvoid(id){const x=db.txs.find(t=>t.id===id);if(erpLocked(x))return ov(`<h2>Tidak bisa dibatalkan dari POS</h2>${erpLockNote()}<button class="btn" onclick="cl()">Tutup</button>`);ov(`<h2>Batalkan transaksi?</h2><p><b>${esc(x.id)}</b><br>Total ${rp(x.total)}</p><p>Transaksi tetap tersimpan di riwayat dengan status Dibatalkan, tidak dihitung dalam omzet.</p><div class="err" id="m"></div><div class="row"><button class="btn" id="ok" onclick="tdo('${id}','void')">Ya, batalkan</button><button class="btn s" onclick="cl()">Kembali</button></div>`)}
function tdel(id){const x=db.txs.find(t=>t.id===id);if(erpLocked(x))return ov(`<h2>Tidak bisa dihapus dari POS</h2>${erpLockNote()}<button class="btn" onclick="cl()">Tutup</button>`);ov(`<h2>Hapus transaksi?</h2><p><b>${esc(x.id)}</b><br>Total ${rp(x.total)}</p><p>Transaksi beserta semua rincian itemnya dihapus permanen dan tidak dapat dikembalikan. Alternatif yang lebih aman: batalkan transaksi.</p><div class="err" id="m"></div><div class="row"><button class="btn" ${RB} id="ok" onclick="tdo('${id}','del')">Hapus permanen</button><button class="btn s" onclick="cl()">Batal</button></div>`)}
function tdo(id,mode){if(busy)return;const target=db.txs.find(x=>x.id===id);if(erpLocked(target))return;busy=true;const b=$('ok');if(b)b.disabled=true;const snap=JSON.stringify(db.txs);
  try{const i=db.txs.findIndex(x=>x.id===id);if(i<0)throw new Error('tidak ditemukan');
    if(mode==='del')db.txs.splice(i,1);else Object.assign(db.txs[i],{void:true,voidAt:new Date().toISOString()});
    save();cl();render();toast(mode==='del'?'Transaksi dihapus.':'Transaksi dibatalkan.')}
  catch(e){db.txs=JSON.parse(snap);setM('Gagal menyimpan perubahan. Tidak ada data yang diubah.')}
  finally{busy=false}}
async function loadBusiness(id){ERP.setActiveBusiness(id);const biz=ERP.getActiveBusiness();if(!biz)throw new Error('Usaha aktif tidak ditemukan di ERP.');erpBiz=biz;accounts=ERP.getActiveAccounts();catalog=[];catalogCachedAt='';mapping={};db=loadDb();db.biz=Object.assign({},db.biz||{},{id:biz.id,name:biz.name,owner:(erpUser&&erpUser.email)||'',contact:'',addr:biz.address||'',period:biz.period||''});save();
  try{catalog=await PosERP.loadCatalog(id);saveCatalogCache(id,catalog)}
  catch(e){const cached=readCatalogCache(id);if(!cached)throw e;catalog=cached.items;catalogCachedAt=cached.at||'offline'}
  mapping=PosERP.loadMapping(id);if(!PosERP.hasAnyMapping(mapping,accounts))mapping=PosERP.guessMapping(accounts,PosERP.METHODS);booting=false;bootError='';render()}
async function boot(){booting=true;bootError='';render();
  if(typeof ERPAuth==='undefined'||typeof ERP==='undefined'||typeof SaleCore==='undefined'||!window.PosERP){booting=false;bootError='Layanan login atau mesin ERP tidak termuat. Periksa koneksi lalu muat ulang halaman.';render();return}
  ERPAuth.onReady(async function(user){erpUser=user||null;
    try{await PosERP.syncERP();const biz=ERP.getActiveBusiness();if(!biz){erpBiz=null;db=null;booting=false;render();return}await loadBusiness(biz.id)}
    catch(e){bootError=ERP.friendlyError?ERP.friendlyError(e):String((e&&e.message)||e);booting=false;render()}})}
function ov(h){$('ov').innerHTML=`<div class="ov" onclick="if(event.target===this)cl()"><div class="md">${h}</div></div>`}
function cl(){$('ov').innerHTML=''}
regSW();
boot();
</script></body></html>
